services:
  db:
    image: postgres:16
    container_name: contabilidad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contabilidad
      POSTGRES_PASSWORD: contabilidad
      POSTGRES_DB: contabilidad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contabilidad -d contabilidad"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
